version = 0.1
[default.deploy.parameters]
stack_name = "smartevac-cloud"
resolve_s3 = true
s3_prefix = "smartevac-cloud"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
# NoEcho params (GoogleApiKey, GoogleTtsApiKey) are intentionally omitted here.
# Pass them via: sam deploy --parameter-overrides at deploy time.
parameter_overrides = "BucketName=smartevac-6124991 IotEndpoint=change-me-ats.iot.us-east-1.amazonaws.com"
