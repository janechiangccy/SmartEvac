[project]
name = "smartevac-cloud"
version = "0.1.0"
description = "SmartEvac — Hazard Orchestrator + Scenario Trigger Lambdas"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.34.69",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv==1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hazard_orchestrator", "src/scenario_trigger"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
